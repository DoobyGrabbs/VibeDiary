[package]
name = "diary"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["datepicker"] }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
jiff = "0.2.38"
pulldown-cmark = "0.13.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Key derivation (Argon2) is far too slow unoptimised, so optimise dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
winresource = "0.1.31"
